  # ── macOS: Clang + GCC ──────────────────────────────────────────────────────

  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: Sequoia,      cc: clang,  cxx: clang++, label: "clang", arch: arm64 }
          - { runner: macos-15, os: Sequoia,      cc: clang,  cxx: clang++, label: "clang", arch: x86 }
          - { runner: macos-15, os: Sequoia,      cc: gcc-15, cxx: g++-15,  label: "gcc",   arch: arm64, brew: gcc@15 }
          - { runner: macos-26, os: Tahoe,        cc: clang,  cxx: clang++, label: "clang", arch: arm64 }
          - { runner: macos-26, os: Tahoe,        cc: clang,  cxx: clang++, label: "clang", arch: x86 }
          - { runner: macos-26, os: Tahoe,        cc: gcc-15, cxx: g++-15,  label: "gcc",   arch: arm64, brew: gcc@15 }
          - { runner: xcode-27, os: Golden Gate,  cc: clang,  cxx: clang++, label: "clang", arch: arm64 }
          - { runner: xcode-27, os: Golden Gate,  cc: clang,  cxx: clang++, label: "clang", arch: x86 }
          - { runner: xcode-27, os: Golden Gate,  cc: gcc-15, cxx: g++-15,  label: "gcc",   arch: arm64, brew: gcc@15 }

    name: macOS ${{ matrix.os }} | ${{ matrix.label }} | ${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install GCC
        if: matrix.brew
        run: brew install -q ${{ matrix.brew }}

      - name: Build (C)
        run: |
          CFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c99"
          if [ "${{ matrix.arch }}" = "x86" ]; then CFLAGS="$CFLAGS -arch x86_64"; fi
          ${{ matrix.cc }} -I src $CFLAGS src/whereami.c example/executable.c -o executable
          ${{ matrix.cc }} -I src $CFLAGS -shared src/whereami.c example/library.c -o library.dylib

      - name: Build (C++)
        run: |
          CXXFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c++11"
          if [ "${{ matrix.arch }}" = "x86" ]; then CXXFLAGS="$CXXFLAGS -arch x86_64"; fi
          if [ "${{ matrix.label }}" = "gcc" ]; then
            # Apple FB22501039
            CXXFLAGS="$CXXFLAGS -D_Static_assert(expression,message)="
          fi
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS src/whereami.c example/executable.c -o executable-cpp
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS -shared src/whereami.c example/library.c -o library-cpp.dylib

      - name: Run and validate (C)
        if: matrix.arch != 'x86'
        run: |
          output=$(./executable)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qE '^executable path: .+/executable$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable$'
          printf '%s\n' "$output" | grep -qE '^module path: .+/executable$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable$'
          echo '───'
          output=$(./executable --load-library=./library.dylib)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^executable path: .+/executable$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: executable$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^module path: .+/library\.dylib$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: library\.dylib$'

      - name: Run and validate (C++)
        if: matrix.arch != 'x86'
        run: |
          output=$(./executable-cpp)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qE '^executable path: .+/executable-cpp$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable-cpp$'
          printf '%s\n' "$output" | grep -qE '^module path: .+/executable-cpp$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable-cpp$'
          echo '───'
          output=$(./executable-cpp --load-library=./library-cpp.dylib)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^executable path: .+/executable-cpp$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: executable-cpp$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^module path: .+/library-cpp\.dylib$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: library-cpp\.dylib$'

      - name: Build whereami.c inside a larger translation unit
        run: |
          CFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c99"
          if [ "${{ matrix.arch }}" = "x86" ]; then CFLAGS="$CFLAGS -arch x86_64"; fi
          CXXFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c++11"
          if [ "${{ matrix.arch }}" = "x86" ]; then CXXFLAGS="$CXXFLAGS -arch x86_64"; fi
          if [ "${{ matrix.label }}" = "gcc" ]; then
            # Apple FB22501039
            CXXFLAGS="$CXXFLAGS -D_Static_assert(expression,message)="
          fi
          cat > amalgamation.c <<'EOF'
          #include "whereami.h"
          #include "whereami.c"

          int main(void)
          {
            return (wai_getExecutablePath(0, 0, 0) < 0) || (wai_getModulePath(0, 0, 0) < 0);
          }
          EOF
          ${{ matrix.cc }} -I src $CFLAGS amalgamation.c -o amalgamation
          if [ "${{ matrix.arch }}" != "x86" ]; then ./amalgamation; fi
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS amalgamation.c -o amalgamation-cpp
          if [ "${{ matrix.arch }}" != "x86" ]; then ./amalgamation-cpp; fi

      - name: Build with the documented customization macros
        run: |
          CFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c99"
          if [ "${{ matrix.arch }}" = "x86" ]; then CFLAGS="$CFLAGS -arch x86_64"; fi
          CXXFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c++11"
          if [ "${{ matrix.arch }}" = "x86" ]; then CXXFLAGS="$CXXFLAGS -arch x86_64"; fi
          if [ "${{ matrix.label }}" = "gcc" ]; then
            # Apple FB22501039
            CXXFLAGS="$CXXFLAGS -D_Static_assert(expression,message)="
          fi
          cat > customized.c <<'EOF'
          #include <stddef.h>

          void* my_malloc(size_t size);
          void* my_realloc(void* p, size_t size);
          void my_free(void* p);

          #include "whereami.c"

          #include <stdio.h>
          #include <stdlib.h>

          void* my_malloc(size_t size) { return malloc(size); }
          void* my_realloc(void* p, size_t size) { return realloc(p, size); }
          void my_free(void* p) { free(p); }

          int main(void)
          {
            char buffer[4096];
            int dirname_length = -1;
            int length = my_getExecutablePath(buffer, (int)sizeof(buffer) - 1, &dirname_length);

            if (length < 0 || dirname_length < 0)
              return 1;
            buffer[length] = '\0';
            printf("executable path: %s\n", buffer);

            return my_getModulePath(buffer, (int)sizeof(buffer) - 1, &dirname_length) < 0;
          }
          EOF
          defines='-DWAI_FUNCSPEC=static -DWAI_PREFIX(f)=my_##f -DWAI_MALLOC(n)=my_malloc(n) -DWAI_REALLOC(p,n)=my_realloc(p,n) -DWAI_FREE(p)=my_free(p)'
          ${{ matrix.cc }} -I src $CFLAGS $defines customized.c -o customized
          if [ "${{ matrix.arch }}" != "x86" ]; then ./customized; fi
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS $defines customized.c -o customized-cpp
          if [ "${{ matrix.arch }}" != "x86" ]; then ./customized-cpp; fi

