name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# GitHub's implicit shell is `bash -e {0}`, without pipefail
# Naming it explicitly gets `bash --noprofile --norc -eo pipefail {0}` instead
defaults:
  run:
    shell: bash

jobs:

  # ── Linux: GCC + Clang, x64 and x86 ─────────────────────────────────────────

  linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 9 — ubuntu-22.04
          - { runner: ubuntu-22.04, cc: gcc-9,    cxx: g++-9,      arch: x64, pkg: gcc-9 g++-9 }
          - { runner: ubuntu-22.04, cc: gcc-9,    cxx: g++-9,      arch: x86, pkg: gcc-9 g++-9 gcc-9-multilib g++-9-multilib }
          - { runner: ubuntu-22.04, cc: gcc-10,   cxx: g++-10,     arch: x64, pkg: gcc-10 g++-10 }
          - { runner: ubuntu-22.04, cc: gcc-10,   cxx: g++-10,     arch: x86, pkg: gcc-10 g++-10 gcc-10-multilib g++-10-multilib }
          - { runner: ubuntu-22.04, cc: gcc-11,   cxx: g++-11,     arch: x64, pkg: gcc-11 g++-11 }
          - { runner: ubuntu-22.04, cc: gcc-11,   cxx: g++-11,     arch: x86, pkg: gcc-11 g++-11 gcc-11-multilib g++-11-multilib }
          - { runner: ubuntu-22.04, cc: gcc-12,   cxx: g++-12,     arch: x64, pkg: gcc-12 g++-12 }
          - { runner: ubuntu-22.04, cc: gcc-12,   cxx: g++-12,     arch: x86, pkg: gcc-12 g++-12 gcc-12-multilib g++-12-multilib }
          # GCC 13–14 — ubuntu-24.04
          - { runner: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     arch: x64, pkg: gcc-13 g++-13 }
          - { runner: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     arch: x86, pkg: gcc-13 g++-13 gcc-13-multilib g++-13-multilib }
          - { runner: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     arch: x64, pkg: gcc-14 g++-14 }
          - { runner: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     arch: x86, pkg: gcc-14 g++-14 gcc-14-multilib g++-14-multilib }
          # GCC 15-16 — ubuntu-26.04
          - { runner: ubuntu-26.04, cc: gcc-15,   cxx: g++-15,     arch: x64, pkg: gcc-15 g++-15 }
          - { runner: ubuntu-26.04, cc: gcc-15,   cxx: g++-15,     arch: x86, pkg: gcc-15 g++-15 gcc-15-multilib g++-15-multilib }
          - { runner: ubuntu-26.04, cc: gcc-16,   cxx: g++-16,     arch: x64, pkg: gcc-16 g++-16 }
          - { runner: ubuntu-26.04, cc: gcc-16,   cxx: g++-16,     arch: x86, pkg: gcc-16 g++-16 gcc-16-multilib g++-16-multilib }
          # Clang 13–15 — ubuntu-22.04
          - { runner: ubuntu-22.04, cc: clang-13, cxx: clang++-13, arch: x64, pkg: clang-13 }
          - { runner: ubuntu-22.04, cc: clang-13, cxx: clang++-13, arch: x86, pkg: clang-13 gcc-multilib g++-multilib }
          - { runner: ubuntu-22.04, cc: clang-14, cxx: clang++-14, arch: x64, pkg: clang-14 }
          - { runner: ubuntu-22.04, cc: clang-14, cxx: clang++-14, arch: x86, pkg: clang-14 gcc-multilib g++-multilib }
          - { runner: ubuntu-22.04, cc: clang-15, cxx: clang++-15, arch: x64, pkg: clang-15 }
          - { runner: ubuntu-22.04, cc: clang-15, cxx: clang++-15, arch: x86, pkg: clang-15 gcc-multilib g++-multilib }
          # Clang 16–22 — ubuntu-24.04, 16 to 18 ship with the image
          - { runner: ubuntu-24.04, cc: clang-16, cxx: clang++-16, arch: x64, pkg: clang-16 }
          - { runner: ubuntu-24.04, cc: clang-16, cxx: clang++-16, arch: x86, pkg: clang-16 gcc-multilib g++-multilib }
          - { runner: ubuntu-24.04, cc: clang-17, cxx: clang++-17, arch: x64, pkg: clang-17 }
          - { runner: ubuntu-24.04, cc: clang-17, cxx: clang++-17, arch: x86, pkg: clang-17 gcc-multilib g++-multilib }
          - { runner: ubuntu-24.04, cc: clang-18, cxx: clang++-18, arch: x64, pkg: clang-18 }
          - { runner: ubuntu-24.04, cc: clang-18, cxx: clang++-18, arch: x86, pkg: clang-18 gcc-multilib g++-multilib }
          - { runner: ubuntu-24.04, cc: clang-19, cxx: clang++-19, arch: x64, pkg: clang-19, llvm_repo: true }
          - { runner: ubuntu-24.04, cc: clang-19, cxx: clang++-19, arch: x86, pkg: clang-19 gcc-multilib g++-multilib, llvm_repo: true }
          - { runner: ubuntu-24.04, cc: clang-20, cxx: clang++-20, arch: x64, pkg: clang-20, llvm_repo: true }
          - { runner: ubuntu-24.04, cc: clang-20, cxx: clang++-20, arch: x86, pkg: clang-20 gcc-multilib g++-multilib, llvm_repo: true }
          - { runner: ubuntu-24.04, cc: clang-21, cxx: clang++-21, arch: x64, pkg: clang-21, llvm_repo: true }
          - { runner: ubuntu-24.04, cc: clang-21, cxx: clang++-21, arch: x86, pkg: clang-21 gcc-multilib g++-multilib, llvm_repo: true }
          - { runner: ubuntu-24.04, cc: clang-22, cxx: clang++-22, arch: x64, pkg: clang-22, llvm_repo: true }
          - { runner: ubuntu-24.04, cc: clang-22, cxx: clang++-22, arch: x86, pkg: clang-22 gcc-multilib g++-multilib, llvm_repo: true }
          # Clang 23 — ubuntu-26.04
          - { runner: ubuntu-26.04, cc: clang-23, cxx: clang++-23, arch: x64, pkg: clang-23, llvm_repo: true }
          - { runner: ubuntu-26.04, cc: clang-23, cxx: clang++-23, arch: x86, pkg: clang-23 gcc-multilib g++-multilib, llvm_repo: true }
          # Later language standards, on compilers already in the matrix. The
          # sources target C99 and C++11; these keep them conformant up to C23
          # and C++23, where bool, static_assert and friends became keywords
          - { runner: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     arch: x64, pkg: gcc-14 g++-14, cstd: c11, cxxstd: 'c++14' }
          - { runner: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     arch: x64, pkg: gcc-14 g++-14, cstd: c23, cxxstd: 'c++23' }
          - { runner: ubuntu-24.04, cc: clang-18, cxx: clang++-18, arch: x64, pkg: clang-18, cstd: c17, cxxstd: 'c++17' }
          - { runner: ubuntu-24.04, cc: clang-18, cxx: clang++-18, arch: x64, pkg: clang-18, cstd: c23, cxxstd: 'c++20' }

    name: Linux | ${{ matrix.cc }} | ${{ matrix.arch }}${{ matrix.cstd && format(' | {0} / {1}', matrix.cstd, matrix.cxxstd) || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Add LLVM apt repository
        if: matrix.llvm_repo
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${UBUNTU_CODENAME}/ llvm-toolchain-${UBUNTU_CODENAME}-$(echo '${{ matrix.cc }}' | grep -oP '\d+') main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

      - name: Install compiler packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}

      - name: Build (C)
        run: |
          CFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=${{ matrix.cstd || 'c99' }}"
          if [ "${{ matrix.arch }}" = "x86" ]; then CFLAGS="$CFLAGS -m32"; fi
          ${{ matrix.cc }} -I src $CFLAGS src/whereami.c example/executable.c -o executable -ldl
          ${{ matrix.cc }} -I src $CFLAGS -shared -fPIC src/whereami.c example/library.c -o library.so -ldl

      - name: Build (C++)
        run: |
          CXXFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=${{ matrix.cxxstd || 'c++11' }}"
          if [ "${{ matrix.arch }}" = "x86" ]; then CXXFLAGS="$CXXFLAGS -m32"; fi
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS src/whereami.c example/executable.c -o executable-cpp -ldl
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS -shared -fPIC src/whereami.c example/library.c -o library-cpp.so -ldl

      - name: Run and validate (C)
        run: |
          output=$(./executable)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qE '^executable path: .+/executable$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable$'
          printf '%s\n' "$output" | grep -qE '^module path: .+/executable$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable$'
          echo '───'
          output=$(./executable --load-library=./library.so)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^executable path: .+/executable$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: executable$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^module path: .+/library\.so$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: library\.so$'

      - name: Run and validate (C++)
        run: |
          output=$(./executable-cpp)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qE '^executable path: .+/executable-cpp$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable-cpp$'
          printf '%s\n' "$output" | grep -qE '^module path: .+/executable-cpp$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable-cpp$'
          echo '───'
          output=$(./executable-cpp --load-library=./library-cpp.so)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^executable path: .+/executable-cpp$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: executable-cpp$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^module path: .+/library-cpp\.so$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: library-cpp\.so$'

      - name: Build whereami.c inside a larger translation unit
        run: |
          CFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=${{ matrix.cstd || 'c99' }}"
          CXXFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=${{ matrix.cxxstd || 'c++11' }}"
          if [ "${{ matrix.arch }}" = "x86" ]; then CFLAGS="$CFLAGS -m32"; CXXFLAGS="$CXXFLAGS -m32"; fi
          cat > amalgamation.c <<'EOF'
          #include "whereami.h"
          #include "whereami.c"

          int main(void)
          {
            return (wai_getExecutablePath(0, 0, 0) < 0) || (wai_getModulePath(0, 0, 0) < 0);
          }
          EOF
          ${{ matrix.cc }} -I src $CFLAGS amalgamation.c -o amalgamation
          ./amalgamation
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS amalgamation.c -o amalgamation-cpp
          ./amalgamation-cpp

      - name: Build with the documented customization macros
        run: |
          CFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=${{ matrix.cstd || 'c99' }}"
          CXXFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=${{ matrix.cxxstd || 'c++11' }}"
          if [ "${{ matrix.arch }}" = "x86" ]; then CFLAGS="$CFLAGS -m32"; CXXFLAGS="$CXXFLAGS -m32"; fi
          cat > customized.c <<'EOF'
          #include <stddef.h>

          void* my_malloc(size_t size);
          void* my_realloc(void* p, size_t size);
          void my_free(void* p);

          #include "whereami.c"

          #include <stdio.h>
          #include <stdlib.h>

          void* my_malloc(size_t size) { return malloc(size); }
          void* my_realloc(void* p, size_t size) { return realloc(p, size); }
          void my_free(void* p) { free(p); }

          int main(void)
          {
            char buffer[4096];
            int dirname_length = -1;
            int length = my_getExecutablePath(buffer, (int)sizeof(buffer) - 1, &dirname_length);

            if (length < 0 || dirname_length < 0)
              return 1;
            buffer[length] = '\0';
            printf("executable path: %s\n", buffer);

            return my_getModulePath(buffer, (int)sizeof(buffer) - 1, &dirname_length) < 0;
          }
          EOF
          defines='-DWAI_FUNCSPEC=static -DWAI_PREFIX(f)=my_##f -DWAI_MALLOC(n)=my_malloc(n) -DWAI_REALLOC(p,n)=my_realloc(p,n) -DWAI_FREE(p)=my_free(p)'
          ${{ matrix.cc }} -I src $CFLAGS $defines customized.c -o customized
          ./customized
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS $defines customized.c -o customized-cpp
          ./customized-cpp

  # ── Windows: MSVC (VS2022 + VS2026) ─────────────────────────────────────────

  windows-msvc:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022,        label: "2022", arch: x86 }
          - { runner: windows-2022,        label: "2022", arch: x64 }
          - { runner: windows-2025-vs2026, label: "2026", arch: x86 }
          - { runner: windows-2025-vs2026, label: "2026", arch: x64 }

    name: Windows | MSVC ${{ matrix.label }} | ${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            throw "Visual Studio not found"
          }

          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"

          $arch = switch ("${{ matrix.arch }}") {
            "x86"   { "amd64_x86" }
            "x64"   { "amd64" }
            default { throw "unsupported architecture: $_" }
          }

          $script = Join-Path $env:RUNNER_TEMP "setup-msvc.cmd"

          @"
          @echo off
          call "$vcvars" $arch >nul
          if errorlevel 1 exit /b 1
          set
          "@ | Set-Content $script

          $variables = & cmd.exe /d /c $script

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to initialize MSVC environment"
          }

          foreach ($line in $variables) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]

              if ($name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)') {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
              }
            }
          }

      - name: Build (C)
        shell: cmd
        run: |
          cl.exe /nologo /W4 /WX /wd4100 /O2 /I src src\whereami.c example\executable.c /Fe:executable.exe || exit /b 1
          cl.exe /nologo /W4 /WX /wd4100 /O2 /I src /LD src\whereami.c example\library.c /Fe:library.dll || exit /b 1

      - name: Build (C++)
        shell: cmd
        run: |
          cl.exe /nologo /W4 /WX /wd4100 /O2 /EHsc /std:c++14 /I src /TP src\whereami.c example\executable.c /Fe:executable-cpp.exe || exit /b 1
          cl.exe /nologo /W4 /WX /wd4100 /O2 /EHsc /std:c++14 /I src /TP /LD src\whereami.c example\library.c /Fe:library-cpp.dll || exit /b 1

      - name: Run and validate (C)
        shell: pwsh
        run: |
          $output = (& ./executable.exe) | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::executable.exe exited with $LASTEXITCODE"
            exit 1
          }
          Write-Host $output
          if ($output -notmatch '(?m)^executable path: .+\\executable\.exe\r?$') {
            Write-Host "::error::executable path not found or incorrect in output"
            exit 1
          }
          if ($output -notmatch '(?m)^  basename: executable\.exe\r?$') {
            Write-Host "::error::basename not found or incorrect in output"
            exit 1
          }
          if ($output -notmatch '(?m)^module path: .+\\executable\.exe\r?$') {
            Write-Host "::error::module path not found or incorrect in output"
            exit 1
          }
          if ($output -notmatch '(?m)^  basename: executable\.exe\r?$') {
            Write-Host "::error::basename not found or incorrect in output"
            exit 1
          }
          Write-Host '───'
          $output = (& ./executable.exe '--load-library=./library.dll') | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::executable.exe --load-library=./library.dll exited with $LASTEXITCODE"
            exit 1
          }
          Write-Host $output
          if ($output -notmatch '(?m)^library loaded\r?$') {
            Write-Host "::error::library was not loaded"
            exit 1
          }
          if ($output -notmatch '(?m)^executable path: .+\\executable\.exe\r?$') {
            Write-Host "::error::executable path not found or incorrect in library output"
            exit 1
          }
          if ($output -notmatch '(?m)^  basename: executable\.exe\r?$') {
            Write-Host "::error::basename not found or incorrect in library output"
            exit 1
          }
          if ($output -notmatch '(?m)^module path: .+\\library\.dll\r?$') {
            Write-Host "::error::module path not found or incorrect in library output"
            exit 1
          }
          if ($output -notmatch '(?m)^  basename: library\.dll\r?$') {
            Write-Host "::error::basename not found or incorrect in library output"
            exit 1
          }

      - name: Run and validate (C++)
        shell: pwsh
        run: |
          $output = (& './executable-cpp.exe') | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::executable-cpp.exe exited with $LASTEXITCODE"
            exit 1
          }
          Write-Host $output
          if ($output -notmatch '(?m)^executable path: .+\\executable-cpp\.exe\r?$') {
            Write-Host "::error::executable path not found or incorrect in output"
            exit 1
          }
          if ($output -notmatch '(?m)^  basename: executable-cpp\.exe\r?$') {
            Write-Host "::error::basename not found or incorrect in output"
            exit 1
          }
          if ($output -notmatch '(?m)^module path: .+\\executable-cpp\.exe\r?$') {
            Write-Host "::error::module path not found or incorrect in output"
            exit 1
          }
          if ($output -notmatch '(?m)^  basename: executable-cpp\.exe\r?$') {
            Write-Host "::error::basename not found or incorrect in output"
            exit 1
          }
          Write-Host '───'
          $output = (& ./executable-cpp.exe '--load-library=./library-cpp.dll') | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::executable-cpp.exe --load-library=./library-cpp.dll exited with $LASTEXITCODE"
            exit 1
          }
          Write-Host $output
          if ($output -notmatch '(?m)^library loaded\r?$') {
            Write-Host "::error::library was not loaded"
            exit 1
          }
          if ($output -notmatch '(?m)^executable path: .+\\executable-cpp\.exe\r?$') {
            Write-Host "::error::executable path not found or incorrect in library output"
            exit 1
          }
          if ($output -notmatch '(?m)^  basename: executable-cpp\.exe\r?$') {
            Write-Host "::error::basename not found or incorrect in library output"
            exit 1
          }
          if ($output -notmatch '(?m)^module path: .+\\library-cpp\.dll\r?$') {
            Write-Host "::error::module path not found or incorrect in library output"
            exit 1
          }
          if ($output -notmatch '(?m)^  basename: library-cpp\.dll\r?$') {
            Write-Host "::error::basename not found or incorrect in library output"
            exit 1
          }

      - name: Build whereami.c inside a larger translation unit
        shell: pwsh
        run: |
          @'
          #include "whereami.h"
          #include "whereami.c"

          int main(void)
          {
            return (wai_getExecutablePath(0, 0, 0) < 0) || (wai_getModulePath(0, 0, 0) < 0);
          }
          '@ | Set-Content amalgamation.c
          cl.exe /nologo /W4 /WX /wd4100 /O2 /I src amalgamation.c /Fe:amalgamation.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./amalgamation.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build with the documented customization macros
        shell: pwsh
        run: |
          # cl.exe /D cannot define a function-like macro, so the customization
          # points go into the source the way a user would put them in a config
          # header
          @'
          #include <stddef.h>

          void* my_malloc(size_t size);
          void* my_realloc(void* p, size_t size);
          void my_free(void* p);

          #define WAI_FUNCSPEC static
          #define WAI_PREFIX(f) my_##f
          #define WAI_MALLOC(size) my_malloc(size)
          #define WAI_REALLOC(p, size) my_realloc(p, size)
          #define WAI_FREE(p) my_free(p)

          #include "whereami.c"

          #include <stdio.h>
          #include <stdlib.h>

          void* my_malloc(size_t size) { return malloc(size); }
          void* my_realloc(void* p, size_t size) { return realloc(p, size); }
          void my_free(void* p) { free(p); }

          int main(void)
          {
            char buffer[4096];
            int dirname_length = -1;
            int length = my_getExecutablePath(buffer, (int)sizeof(buffer) - 1, &dirname_length);

            if (length < 0 || dirname_length < 0)
              return 1;
            buffer[length] = '\0';
            printf("executable path: %s\n", buffer);

            return my_getModulePath(buffer, (int)sizeof(buffer) - 1, &dirname_length) < 0;
          }
          '@ | Set-Content customized.c
          cl.exe /nologo /W4 /WX /wd4100 /O2 /I src customized.c /Fe:customized.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./customized.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # ── Windows: MinGW (GCC + Clang via MSYS2) ──────────────────────────────────

  windows-mingw:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: mingw32, cc: gcc,   cxx: g++,     arch: x86, pkg: mingw-w64-i686-gcc }
          - { sys: mingw64, cc: gcc,   cxx: g++,     arch: x64, pkg: mingw-w64-x86_64-gcc }
          - { sys: mingw64, cc: clang, cxx: clang++, arch: x64, pkg: mingw-w64-x86_64-clang }

    name: Windows MinGW | ${{ matrix.cc }} | ${{ matrix.arch }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          install: ${{ matrix.pkg }}

      - name: Build (C)
        run: |
          CFLAGS="-O2 -Wall -Wshadow -Wextra -Wno-unused-parameter -pedantic -Werror -std=c99"
          ${{ matrix.cc }} -I src $CFLAGS src/whereami.c example/executable.c -o executable.exe
          ${{ matrix.cc }} -I src $CFLAGS -shared src/whereami.c example/library.c -o library.dll

      - name: Build (C++)
        run: |
          CXXFLAGS="-O2 -Wall -Wshadow -Wextra -Wno-unused-parameter -pedantic -Werror -std=c++11"
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS src/whereami.c example/executable.c -o executable-cpp.exe
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS -shared src/whereami.c example/library.c -o library-cpp.dll

      - name: Run and validate (C)
        run: |
          output=$(./executable.exe | tee >(cat >&2))
          printf '%s\n' "$output" | grep -qE '^executable path: .+\\executable\.exe$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable\.exe$'
          printf '%s\n' "$output" | grep -qE '^module path: .+\\executable\.exe$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable\.exe$'
          echo '───'
          output=$(./executable.exe --load-library=./library.dll | tee >(cat >&2))
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^executable path: .+\\executable\.exe$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: executable\.exe$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^module path: .+\\library\.dll$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: library\.dll$'

      - name: Run and validate (C++)
        run: |
          output=$(./executable-cpp.exe | tee >(cat >&2))
          printf '%s\n' "$output" | grep -qE '^executable path: .+\\executable-cpp\.exe$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable-cpp\.exe$'
          printf '%s\n' "$output" | grep -qE '^module path: .+\\executable-cpp\.exe$'
          printf '%s\n' "$output" | grep -qE '^  basename: executable-cpp\.exe$'
          echo '───'
          output=$(./executable-cpp.exe --load-library=./library-cpp.dll | tee >(cat >&2))
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^executable path: .+\\executable-cpp\.exe$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: executable-cpp\.exe$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^module path: .+\\library-cpp\.dll$'
          printf '%s\n' "$output" | grep -EA10 '^library loaded$' | grep -qE '^  basename: library-cpp\.dll$'

      - name: Build whereami.c inside a larger translation unit
        run: |
          cat > amalgamation.c <<'EOF'
          #include "whereami.h"
          #include "whereami.c"

          int main(void)
          {
            return (wai_getExecutablePath(0, 0, 0) < 0) || (wai_getModulePath(0, 0, 0) < 0);
          }
          EOF
          ${{ matrix.cc }} -I src -O2 -Wall -Wshadow -Wextra -Wno-unused-parameter -pedantic -Werror -std=c99 amalgamation.c -o amalgamation.exe
          ./amalgamation.exe

      - name: Build with the documented customization macros
        run: |
          cat > customized.c <<'EOF'
          #include <stddef.h>

          void* my_malloc(size_t size);
          void* my_realloc(void* p, size_t size);
          void my_free(void* p);

          #define WAI_FUNCSPEC static
          #define WAI_PREFIX(f) my_##f
          #define WAI_MALLOC(size) my_malloc(size)
          #define WAI_REALLOC(p, size) my_realloc(p, size)
          #define WAI_FREE(p) my_free(p)

          #include "whereami.c"

          #include <stdio.h>
          #include <stdlib.h>

          void* my_malloc(size_t size) { return malloc(size); }
          void* my_realloc(void* p, size_t size) { return realloc(p, size); }
          void my_free(void* p) { free(p); }

          int main(void)
          {
            char buffer[4096];
            int dirname_length = -1;
            int length = my_getExecutablePath(buffer, (int)sizeof(buffer) - 1, &dirname_length);

            if (length < 0 || dirname_length < 0)
              return 1;
            buffer[length] = '\0';
            printf("executable path: %s\n", buffer);

            return my_getModulePath(buffer, (int)sizeof(buffer) - 1, &dirname_length) < 0;
          }
          EOF
          ${{ matrix.cc }} -I src -O2 -Wall -Wshadow -Wextra -Wno-unused-parameter -pedantic -Werror -std=c99 customized.c -o customized.exe
          ./customized.exe

