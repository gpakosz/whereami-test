  # ── Sanitizers ──────────────────────────────────────────────────────────────

  sanitizers-asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }

    name: Sanitizers (ASan + UBSan) | ${{ matrix.cc }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build (C)
        run: |
          CFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c99 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
          ${{ matrix.cc }} -I src $CFLAGS src/whereami.c example/executable.c -o executable -ldl
          ${{ matrix.cc }} -I src $CFLAGS -shared -fPIC src/whereami.c example/library.c -o library.so -ldl

