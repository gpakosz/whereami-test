          CXXFLAGS="-O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c++11 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
          ${{ matrix.cxx }} -x c++ -I src $CXXFLAGS src/whereami.c example/executable.c -o executable-cpp -ldl
