          EOF
          ${{ matrix.cc }} -I src -O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c99 amalgamation.c -o amalgamation.exe -ldl
          ./amalgamation.exe
          ${{ matrix.cxx }} -x c++ -I src -O2 -Wall -Wshadow -Wextra -pedantic -Werror -std=c++11 amalgamation.c -o amalgamation-cpp.exe -ldl
          ./amalgamation-cpp.exe

      - name: Build with the documented customization macros
        run: |
